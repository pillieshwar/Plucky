# cargo-deny policy, checked by .github/workflows/security.yml.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Plucky ships for macOS and Windows; ignore crates only Linux builds use.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
# Known vulnerabilities always fail. Crates marked unmaintained fail only when
# Plucky depends on them directly; deeper ones are reported as warnings.
unmaintained = "workspace"
yanked = "deny"
# Each ignored advisory needs a reason and is reviewed when it changes.
ignore = [
  # Every zip 4.x release was yanked by its maintainer (October 2026), but
  # tauri-plugin-updater — including its 3.0 pre-releases — still requires
  # zip ^4, so there is nothing newer to move to. Yanked is not vulnerable:
  # no RustSec/OSV advisory exists for it (both checks run here). Pinned to
  # this exact version so any change shows up again. Revisit when Tauri's
  # updater moves to a newer zip.
  { crate = "zip@4.6.1", reason = "All zip 4.x yanked upstream; tauri-plugin-updater requires zip ^4; no advisory" },
]

[sources]
# Only crates.io; no git or other registries can sneak in.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
