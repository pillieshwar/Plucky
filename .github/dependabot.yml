# Weekly update pull requests for Rust crates, npm packages and GitHub
# Actions. Security fixes are opened straight away (Dependabot security
# updates, enabled in the repo settings), regardless of this schedule.
#
# cooldown: wait a week before proposing a brand-new release, so a
# compromised or broken version has time to be caught and yanked first.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Tauri's crates are released together; update them together.
      tauri:
        patterns: ["tauri", "tauri-*"]
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
