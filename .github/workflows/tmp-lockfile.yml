# Temporary (removed before merge): refresh package-lock.json for new npm
# dependencies, from a sandbox that can't reach the npm registry.
name: tmp-lockfile
on:
  push:
    branches: [v0.4.66-agent-panel]
    paths: [package.json, .github/workflows/tmp-lockfile.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Refresh package-lock.json for @xterm/xterm and @xterm/addon-fit"
          git push
