name: UI preview

# Renders the UI with a fake backend and pushes screenshots to the
# `ui-previews` branch, so changes can be reviewed without a Mac. Runs on
# macOS so the shots use the real system font and Mac shortcut symbols.

on:
  workflow_dispatch:
  push:
    branches: ["v0.*"]
    paths: ["src/**", "scripts/ui-preview/**", ".github/workflows/ui-preview.yml"]

permissions: {}

concurrency:
  group: ui-preview
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-latest
    permissions:
      # Pushes the screenshots to the ui-previews branch.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Install Playwright
        # Screenshot tooling only, never part of the app; pinned to an exact
        # version. (Kept out of package.json: npm 10 can't resolve it next to
        # vitest's optional Playwright integration.)
        run: |
          npm install --no-save playwright@1.48.2 # zizmor: ignore[adhoc-packages]
          npx playwright install chromium
      - name: Screenshots
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 3
          TZ=America/Los_Angeles node scripts/ui-preview/preview.mjs http://localhost:4173 shots
      - name: Push to ui-previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b ui-previews
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "UI preview for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" ui-previews
