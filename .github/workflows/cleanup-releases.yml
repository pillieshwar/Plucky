name: Clean up old releases

# One-off housekeeping, run by hand from the Actions tab: deletes every
# GitHub Release and tag except the one to keep (e.g. v0.4.45), so the
# Releases page only offers the current version.

on:
  workflow_dispatch:
    inputs:
      keep:
        description: "The release tag to keep, e.g. v0.4.45"
        required: true
        type: string

permissions: {}

jobs:
  cleanup:
    name: Delete old releases and tags
    runs-on: ubuntu-latest
    permissions:
      contents: write # delete releases and tags
    steps:
      - name: Delete everything but the kept release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail
          if ! [[ "$KEEP" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'keep' must look like v1.2.3"
            exit 1
          fi
          gh release list --repo "$REPO" --limit 1000 --json tagName -q '.[].tagName' | while read -r tag; do
            [ "$tag" = "$KEEP" ] && continue
            echo "Deleting release $tag"
            gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag || gh release delete "$tag" --repo "$REPO" --yes
          done
          gh api "repos/$REPO/git/matching-refs/tags/" -q '.[].ref' | while read -r ref; do
            [ "$ref" = "refs/tags/$KEEP" ] && continue
            echo "Deleting $ref"
            gh api -X DELETE "repos/$REPO/git/$ref" || true
          done
          echo "Left: $(gh release list --repo "$REPO" --json tagName -q '[.[].tagName] | join(", ")')"
