name: Deploy relay

# Deploys the sync relay (relay/) to Cloudflare Workers whenever it changes
# on main, or by hand from the Actions tab. Needs the repository secrets
# CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: relay-deploy
  cancel-in-progress: false

env:
  WRANGLER: wrangler@4.148.0

jobs:
  deploy:
    name: Deploy relay to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the Cloudflare secrets are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy
        id: deploy
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes "$WRANGLER" deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then echo "::notice::Relay deployed at $url"; fi

      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          sleep 5
          test "$(curl -fsS "$URL/health")" = "ok"
          # Each check says what it saw, so a failure shows in the run summary.
          check() { if ! eval "$2"; then echo "::error::smoke test: $1 (saw: ${3:-})"; exit 1; fi; }
          # A mailbox: pass, put, list, ack (which deletes), and the gap a
          # late Mac would see.
          mailbox="ci_$(openssl rand -hex 16)"
          pass="$(openssl rand -hex 24)"
          box() { curl -sS -H "authorization: Bearer $pass" -H "x-device: $1" "${@:2}"; }
          reg=$(box ci_dev_A -X PUT "$URL/v1/m/$mailbox/devices/ci_dev_B" -d '{"acked":0}')
          check "register a device" '[[ "$reg" == *ok* ]]' "$reg"
          put=$(box ci_dev_A -X POST --data-binary "smoke-test" "$URL/v1/m/$mailbox/boxes")
          check "put a box" '[[ "$put" == *"\"box\":1"* ]]' "$put"
          got=$(box ci_dev_B "$URL/v1/m/$mailbox/boxes?after=0")
          check "list boxes" '[[ "$got" == *"$(printf smoke-test | base64)"* && "$got" == *"\"gap\":false"* ]]' "$got"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer wrong-pass-wrong-pass-wrong-pass-00" -H "x-device: ci_dev_C" "$URL/v1/m/$mailbox/boxes")
          check "wrong pass is refused" '[[ "$code" == 401 ]]' "$code"
          ack=$(box ci_dev_B -X POST "$URL/v1/m/$mailbox/ack" -d '{"upto":1}')
          check "ack" '[[ "$ack" == *ok* ]]' "$ack"
          late=$(box ci_dev_B "$URL/v1/m/$mailbox/boxes?after=0")
          check "acked boxes are deleted, late readers see a gap" '[[ "$late" == *"\"boxes\":[]"* && "$late" == *"\"gap\":true"* ]]' "$late"
          del=$(box ci_dev_A -X DELETE "$URL/v1/m/$mailbox")
          check "delete the mailbox" '[[ "$del" == *ok* ]]' "$del"
          # A pairing room.
          room=$(LC_ALL=C tr -dc '23456789ABCDEFGHJKMNPQRSTUVWXYZ' </dev/urandom | head -c 8)
          o=$(curl -sS -X POST --data 'hello' "$URL/v1/pair/$room?new=1")
          check "open a room" '[[ "$o" == *ok* ]]' "$o"
          o=$(curl -sS -X POST --data 'there' "$URL/v1/pair/$room")
          check "post to a room" '[[ "$o" == *ok* ]]' "$o"
          msgs=$(curl -sS "$URL/v1/pair/$room?after=1")
          check "read a room" '[[ "$msgs" == "{\"msgs\":[\"there\"]}" ]]' "$msgs"
          curl -sS -X DELETE "$URL/v1/pair/$room" >/dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/v1/pair/$room")
          check "closed rooms are gone" '[[ "$code" == 404 ]]' "$code"
          echo "::notice::Relay answers: health, mailbox (pass, put, list, ack, gap) and pairing rooms work."
