name: Deploy relay

# Deploys the sync relay (relay/) to Cloudflare Workers whenever it changes
# on main, or by hand from the Actions tab. Needs the repository secrets
# CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: relay-deploy
  cancel-in-progress: false

env:
  WRANGLER: wrangler@4.148.0

jobs:
  deploy:
    name: Deploy relay to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the Cloudflare secrets are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy
        id: deploy
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes "$WRANGLER" deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then echo "::notice::Relay deployed at $url"; fi

      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          sleep 5
          test "$(curl -fsS "$URL/health")" = "ok"
          mailbox="ci_$(openssl rand -hex 16)"
          put=$(curl -fsS -X PUT --data-binary "smoke-test" "$URL/v1/m/$mailbox/boxes")
          echo "put: $put"
          echo "$put" | grep -q '"box":1'
          got=$(curl -fsS "$URL/v1/m/$mailbox/boxes?after=0")
          echo "$got" | grep -q "$(printf 'smoke-test' | base64)"
          echo "::notice::Relay answers: health ok, put and get work."
