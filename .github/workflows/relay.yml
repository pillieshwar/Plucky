name: Deploy relay

# Deploys the sync relay (relay/) to Cloudflare Workers whenever it changes
# on main, or by hand from the Actions tab. Needs the repository secrets
# CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: relay-deploy
  cancel-in-progress: false

env:
  WRANGLER: wrangler@4.148.0

jobs:
  deploy:
    name: Deploy relay to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the Cloudflare secrets are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy
        id: deploy
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes "$WRANGLER" deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then echo "::notice::Relay deployed at $url"; fi

      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          sleep 5
          test "$(curl -fsS "$URL/health")" = "ok"
          # A mailbox: pass, put, list, ack (which deletes), and the gap a
          # late Mac would see.
          mailbox="ci_$(openssl rand -hex 16)"
          pass="$(openssl rand -hex 24)"
          box() { curl -fsS -H "authorization: Bearer $pass" -H "x-device: $1" "${@:2}"; }
          box ci_dev_A -X PUT "$URL/v1/m/$mailbox/devices/ci_dev_B" -d '{"acked":0}' >/dev/null
          put=$(box ci_dev_A -X POST --data-binary "smoke-test" "$URL/v1/m/$mailbox/boxes")
          echo "put: $put"
          echo "$put" | grep -q '"box":1'
          got=$(box ci_dev_B "$URL/v1/m/$mailbox/boxes?after=0")
          echo "got: $got"
          echo "$got" | grep -q "$(printf 'smoke-test' | base64)"
          echo "$got" | grep -q '"gap":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer wrong-pass-wrong-pass-wrong-pass-00" -H "x-device: ci_dev_C" "$URL/v1/m/$mailbox/boxes")" = 401
          box ci_dev_B -X POST "$URL/v1/m/$mailbox/ack" -d '{"upto":1}' >/dev/null
          late=$(box ci_dev_B "$URL/v1/m/$mailbox/boxes?after=0")
          echo "after ack: $late"
          echo "$late" | grep -q '"boxes":\[\]'
          echo "$late" | grep -q '"gap":true'
          box ci_dev_A -X DELETE "$URL/v1/m/$mailbox" >/dev/null
          # A pairing room.
          code=$(LC_ALL=C tr -dc '23456789ABCDEFGHJKMNPQRSTUVWXYZ' </dev/urandom | head -c 8)
          curl -fsS -X POST --data 'hello' "$URL/v1/pair/$code?new=1" >/dev/null
          curl -fsS -X POST --data 'there' "$URL/v1/pair/$code" >/dev/null
          msgs=$(curl -fsS "$URL/v1/pair/$code?after=1")
          echo "room: $msgs"
          test "$msgs" = '{"msgs":["there"]}'
          curl -fsS -X DELETE "$URL/v1/pair/$code" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/v1/pair/$code")" = 404
          echo "::notice::Relay answers: health, mailbox (pass, put, list, ack, gap) and pairing rooms work."
