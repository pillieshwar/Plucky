name: Release

# Builds the Mac app and publishes it as a GitHub Release. Run it either by
# pushing a tag like v0.1.0, or from the Actions tab ("Release" → "Run
# workflow"), which tags the current commit with the version in
# src-tauri/tauri.conf.json. The "Download TodoCity" button links to
#   https://github.com/<owner>/<repo>/releases/latest/download/TodoCity-macOS.dmg
# which always points at the newest release.
#
# Signing (optional): add these repository secrets to ship a Developer ID
# signed and notarized app that opens without any Gatekeeper warning:
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Without them the app is ad-hoc signed and users confirm it once in
# System Settings → Privacy & Security → Open Anyway.
#
# In-app updates: add TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the key whose public half is in
# tauri.conf.json → plugins.updater.pubkey). The release then also carries
# TodoCity.app.tar.gz, its .sig and latest.json, which installed copies of
# TodoCity checks for updates.
#
# Supply chain: builds use only the committed lockfiles, start from an empty
# cache (a poisoned cache can't reach a signed release), and every .dmg and
# update archive gets a signed build-provenance attestation that anyone can
# check with `gh attestation verify <file> --repo pillieshwar/TodoCity`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (otherwise only build)"
        type: boolean
        default: true

permissions: {}

env:
  LLAMA_CPP_REF: b11609
  CARGO_TERM_COLOR: never

jobs:
  macos:
    name: Build and publish Mac app
    runs-on: macos-latest
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out the release tag
        id: tag
        shell: bash
        run: |
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no caches in releases

      - name: Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      # No caches in releases: everything is built from source here.
      - name: Build bundled model runtime (universal llama-server)
        shell: bash
        run: scripts/build-llama-server.sh universal-apple-darwin

      - run: npm ci

      - name: Build TodoCity.app and .dmg (universal)
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          extra=()
          if [ -n "$UPDATER_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$UPDATER_KEY" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATER_KEY_PASSWORD"
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret — this release won't be offered as an in-app update."
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          if [ -n "$CERT" ]; then
            echo "Signing with Developer ID and notarizing"
            export APPLE_CERTIFICATE="$CERT" APPLE_CERTIFICATE_PASSWORD="$CERT_PASSWORD" \
                   APPLE_SIGNING_IDENTITY="$IDENTITY" APPLE_ID="$AID" APPLE_PASSWORD="$APW" APPLE_TEAM_ID="$TEAM"
          else
            echo "::warning::No Apple signing secrets — building an ad-hoc signed app (users confirm it once in Privacy & Security)."
            # Ad-hoc signing keeps Apple silicon from reporting the app as "damaged".
            export APPLE_SIGNING_IDENTITY="-"
          fi
          # The target folder is cached between runs; start from empty bundles so
          # only this build's app is found below.
          rm -rf target/universal-apple-darwin/release/bundle
          scripts/ci-annotate.sh npm run tauri build -- --target universal-apple-darwin --bundles app,dmg "${extra[@]}"

      - name: Verify bundle
        shell: bash
        env:
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          trap 'echo "::error::Verify failed at: $BASH_COMMAND"' ERR
          echo "::notice::bundle/macos: $(ls target/universal-apple-darwin/release/bundle/macos 2>&1 | tr '\n' ' ')"
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app)
          lipo -info "$app/Contents/MacOS/llama-server"
          echo "::notice::bundle $app contains: $(ls "$app/Contents/MacOS" | tr '\n' ' ')"
          exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
          lipo -info "$app/Contents/MacOS/$exe" || { echo "::error::main binary $exe: lipo failed"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app" 2>codesign.txt || { echo "::error::codesign: $(tr '\n' ' ' < codesign.txt)"; exit 1; }
          "$app/Contents/MacOS/llama-server" --version || { echo "::error::llama-server --version failed"; exit 1; }
          if [ "$SIGNED" = "true" ]; then
            # Must say "accepted, source=Notarized Developer ID" or users get the warning.
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Authority|TeamIdentifier"
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          fi

      - name: Prepare release files
        id: files
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist-release
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
          # Just what people need: the app to download, and what installed
          # copies read to update themselves (the source code is added by GitHub).
          cp "$dmg" dist-release/TodoCity-macOS.dmg
          tarball=$(ls target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -n1 || true)
          if [ -n "$tarball" ] && [ -f "$tarball.sig" ]; then
            cp "$tarball" dist-release/TodoCity.app.tar.gz
            cp "$tarball.sig" dist-release/TodoCity.app.tar.gz.sig
            # The manifest installed copies read to find updates.
            python3 - <<'PY'
          import json, os, datetime
          tag = os.environ["TAG"]
          url = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}/TodoCity.app.tar.gz"
          sig = open("dist-release/TodoCity.app.tar.gz.sig").read().strip()
          entry = {"signature": sig, "url": url}
          # What's new in this version (src/whats-new.json), for the update card.
          new = json.load(open("src/whats-new.json")).get(tag.lstrip("v"), [])
          manifest = {
              "version": tag.lstrip("v"),
              "notes": "\n".join(f"- {line}" for line in new) or f"TodoCity {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"darwin-aarch64": entry, "darwin-x86_64": entry},
          }
          json.dump(manifest, open("dist-release/latest.json", "w"), indent=2)
          PY
            cat dist-release/latest.json
          else
            echo "::warning::No signed updater archive was built; skipping latest.json."
          fi
          (cd dist-release && shasum -a 256 *.dmg)

      - name: Attest build provenance
        id: attest
        if: github.ref_type == 'tag' || inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*.dmg
            dist-release/TodoCity.app.tar.gz

      - name: Ship the provenance with the release
        # The signed SLSA provenance (a Sigstore bundle) as a release file too,
        # so it can be checked offline: `gh attestation verify
        # TodoCity-macOS.dmg --repo REPO --bundle TodoCity.intoto.jsonl`.
        if: github.ref_type == 'tag' || inputs.publish
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist-release/TodoCity.intoto.jsonl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TodoCity-macOS
          path: dist-release/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cat > notes.md <<'EOF'
          ## Download

          **[Download TodoCity for Mac](https://github.com/REPO/releases/latest/download/TodoCity-macOS.dmg)** — Apple silicon and Intel, macOS 11 or later.

          1. Open `TodoCity-macOS.dmg` and drag **TodoCity** into **Applications**.
          2. Open TodoCity from Applications.
          3. The tour walks you through the rest: permission, model download (about 2 GB, once), shortcuts and a first capture.


          **Verify your download** (optional): `gh attestation verify TodoCity-macOS.dmg --repo REPO` confirms it was built by this repository's release workflow. The signed provenance is also attached as `TodoCity.intoto.jsonl`, for checking offline with `--bundle`.
          EOF
          sed -i '' "s#REPO#${GITHUB_REPOSITORY}#g" notes.md
          # What's new first, from src/whats-new.json (the app shows the same lines).
          python3 - <<'PY'
          import json, os
          lines = json.load(open("src/whats-new.json")).get(os.environ["TAG"].lstrip("v"), [])
          body = open("notes.md").read()
          if lines:
              body = "## What's new\n\n" + "".join(f"- {l}\n" for l in lines) + "\n" + body
          open("notes.md", "w").write(body)
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing its files"
            gh release upload "$TAG" dist-release/* --clobber
            gh release edit "$TAG" --title "TodoCity $TAG" --notes-file notes.md
          else
            # Creates the tag on this commit if it doesn't exist yet.
            gh release create "$TAG" dist-release/* --target "$GITHUB_SHA" \
              --title "TodoCity $TAG" --notes-file notes.md
          fi
          # Only this release's own files: anything else (older names) goes.
          keep=$(cd dist-release && ls)
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r name; do
            if ! grep -qxF "$name" <<<"$keep"; then
              echo "Removing $name"
              gh release delete-asset "$TAG" "$name" --yes
            fi
          done
