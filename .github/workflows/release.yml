name: Release

# Builds the Mac app and publishes it as a GitHub Release. Run it either by
# pushing a tag like v0.1.0, or from the Actions tab ("Release" → "Run
# workflow"), which tags the current commit with the version in
# src-tauri/tauri.conf.json. The "Download Plucky" button links to
#   https://github.com/<owner>/<repo>/releases/latest/download/Plucky-macOS.dmg
# (Pluck-macOS.dmg, the name from before the rename, is uploaded too so old
# links keep working).
# which always points at the newest release.
#
# Signing (optional): add these repository secrets to ship a Developer ID
# signed and notarized app that opens without any Gatekeeper warning:
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Without them the app is ad-hoc signed and users confirm it once in
# System Settings → Privacy & Security → Open Anyway.
#
# In-app updates: add TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the key whose public half is in
# tauri.conf.json → plugins.updater.pubkey). The release then also carries
# Plucky.app.tar.gz, its .sig and latest.json, which installed copies of
# Pluck and Plucky check for updates.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (otherwise only build)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  LLAMA_CPP_REF: b11609
  CARGO_TERM_COLOR: never

jobs:
  macos:
    name: Build and publish Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        id: tag
        shell: bash
        run: |
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache llama-server build
        uses: actions/cache@v4
        with:
          path: target/llama.cpp
          key: llama-universal-${{ env.LLAMA_CPP_REF }}-${{ hashFiles('scripts/build-llama-server.sh') }}

      - name: Build bundled model runtime (universal llama-server)
        shell: bash
        run: scripts/build-llama-server.sh universal-apple-darwin

      - run: npm install

      - name: Build Plucky.app and .dmg (universal)
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          extra=()
          if [ -n "$UPDATER_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$UPDATER_KEY" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATER_KEY_PASSWORD"
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret — this release won't be offered as an in-app update."
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          if [ -n "$CERT" ]; then
            echo "Signing with Developer ID and notarizing"
            export APPLE_CERTIFICATE="$CERT" APPLE_CERTIFICATE_PASSWORD="$CERT_PASSWORD" \
                   APPLE_SIGNING_IDENTITY="$IDENTITY" APPLE_ID="$AID" APPLE_PASSWORD="$APW" APPLE_TEAM_ID="$TEAM"
          else
            echo "::warning::No Apple signing secrets — building an ad-hoc signed app (users confirm it once in Privacy & Security)."
            # Ad-hoc signing keeps Apple silicon from reporting the app as "damaged".
            export APPLE_SIGNING_IDENTITY="-"
          fi
          # The target folder is cached between runs; start from empty bundles so
          # only this build's app is found below.
          rm -rf target/universal-apple-darwin/release/bundle
          scripts/ci-annotate.sh npm run tauri build -- --target universal-apple-darwin --bundles app,dmg "${extra[@]}"

      - name: Verify bundle
        shell: bash
        env:
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          trap 'echo "::error::Verify failed at: $BASH_COMMAND"' ERR
          echo "::notice::bundle/macos: $(ls target/universal-apple-darwin/release/bundle/macos 2>&1 | tr '\n' ' ')"
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app)
          lipo -info "$app/Contents/MacOS/llama-server"
          echo "::notice::bundle $app contains: $(ls "$app/Contents/MacOS" | tr '\n' ' ')"
          exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
          lipo -info "$app/Contents/MacOS/$exe" || { echo "::error::main binary $exe: lipo failed"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app" 2>codesign.txt || { echo "::error::codesign: $(tr '\n' ' ' < codesign.txt)"; exit 1; }
          "$app/Contents/MacOS/llama-server" --version || { echo "::error::llama-server --version failed"; exit 1; }
          if [ "$SIGNED" = "true" ]; then
            # Must say "accepted, source=Notarized Developer ID" or users get the warning.
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Authority|TeamIdentifier"
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          fi

      - name: Prepare release files
        id: files
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist-release
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
          cp "$dmg" dist-release/Plucky-macOS.dmg
          cp "$dmg" dist-release/Pluck-macOS.dmg
          cp "$dmg" "dist-release/$(basename "$dmg")"
          tarball=$(ls target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -n1 || true)
          if [ -n "$tarball" ] && [ -f "$tarball.sig" ]; then
            cp "$tarball" dist-release/Plucky.app.tar.gz
            cp "$tarball.sig" dist-release/Plucky.app.tar.gz.sig
            # The manifest installed copies of Plucky read to find updates.
            python3 - <<'PY'
          import json, os, datetime
          tag = os.environ["TAG"]
          url = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}/Plucky.app.tar.gz"
          sig = open("dist-release/Plucky.app.tar.gz.sig").read().strip()
          entry = {"signature": sig, "url": url}
          manifest = {
              "version": tag.lstrip("v"),
              "notes": f"Plucky {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"darwin-aarch64": entry, "darwin-x86_64": entry},
          }
          json.dump(manifest, open("dist-release/latest.json", "w"), indent=2)
          PY
            cat dist-release/latest.json
          else
            echo "::warning::No signed updater archive was built; skipping latest.json."
          fi
          (cd dist-release && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Plucky-macOS
          path: dist-release/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cat > notes.md <<'EOF'
          ## Download

          **[Download Plucky for Mac](https://github.com/${{ github.repository }}/releases/latest/download/Plucky-macOS.dmg)** — Apple silicon and Intel, macOS 11 or later.

          1. Open `Plucky-macOS.dmg` and drag **Plucky** into **Applications**.
          2. Open Plucky. If macOS says it can't verify the app, open **System Settings → Privacy & Security** and click **Open Anyway**.
          3. The tour walks you through the rest: permission, model download (about 2 GB, once), shortcuts and a first capture.

          Already using Pluck? It updates itself to Plucky — look for **Restart to update** in the menu bar. Your tasks and settings stay.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing its files"
            gh release upload "$TAG" dist-release/* --clobber
          else
            # Creates the tag on this commit if it doesn't exist yet.
            gh release create "$TAG" dist-release/* --target "$GITHUB_SHA" \
              --title "Plucky $TAG" --notes-file notes.md
          fi
