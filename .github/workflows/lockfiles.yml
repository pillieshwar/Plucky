name: Refresh Cargo.lock (temporary)
on:
  push:
    branches: ["lockfiles/**"]
permissions: {}
jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: |
          curl -sf -H "User-Agent: plucky-ci (github.com/pillieshwar/Plucky)" "https://crates.io/api/v1/crates/zip/versions" | python3 -c "import json,sys; [print('::notice::zip', v['num'], 'YANKED' if v['yanked'] else 'ok', v['created_at'][:10]) for v in json.load(sys.stdin)['versions'] if v['num'].split('.')[0] in ('4','5','6','7','8','9')][:0] or None" || true
          curl -sf -H "User-Agent: plucky-ci (github.com/pillieshwar/Plucky)" "https://crates.io/api/v1/crates/zip/versions" | python3 -c "
import json,sys
vs=json.load(sys.stdin)['versions']
for v in vs[:14]: print('::notice::zip', v['num'], 'YANKED' if v['yanked'] else 'ok', v['created_at'][:10])
"
          curl -sf -H "User-Agent: plucky-ci (github.com/pillieshwar/Plucky)" "https://crates.io/api/v1/crates/tauri-plugin-updater/versions" | python3 -c "
import json,sys
for v in json.load(sys.stdin)['versions'][:4]: print('::notice::updater', v['num'], 'YANKED' if v['yanked'] else 'ok', v['created_at'][:10])
"
          for v in $(curl -sf -H "User-Agent: plucky-ci" "https://crates.io/api/v1/crates/tauri-plugin-updater/versions" | python3 -c "import json,sys; print(' '.join(v['num'] for v in json.load(sys.stdin)['versions'][:3]))"); do
            curl -sf -H "User-Agent: plucky-ci" "https://crates.io/api/v1/crates/tauri-plugin-updater/$v/dependencies" | python3 -c "
import json,sys
for d in json.load(sys.stdin)['dependencies']:
    if d['crate_id']=='zip': print('::notice::updater $v needs zip', d['req'])
"
          done
          exit 1
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "cargo update -p zip"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:${GITHUB_REF_NAME}"
