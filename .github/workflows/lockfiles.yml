name: Refresh Cargo.lock (temporary)
on:
  push:
    branches: ["lockfiles/**"]
permissions: {}
jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: |
          cargo search zip --limit 1 | sed 's/^/::notice::search /' || true
          cargo info zip 2>&1 | head -20 | sed 's/^/::notice::info /' || true
          cargo tree -i zip -e normal --target all 2>&1 | head -10 | sed 's/^/::notice::tree /' || true
          cargo update -p zip 2>&1 | tee up.log || { sed 's/^/::warning::/' up.log; exit 1; }
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "cargo update -p zip"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:${GITHUB_REF_NAME}"
