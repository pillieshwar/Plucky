name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_CPP_REF: b11609
  CARGO_TERM_COLOR: never

jobs:
  core:
    name: Rust core (tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo fmt --all --check
      - name: Test
        shell: bash
        run: scripts/ci-annotate.sh cargo test --locked -p pluck-core
      - name: Clippy
        shell: bash
        run: scripts/ci-annotate.sh cargo clippy --locked -p pluck-core --all-targets --message-format=short -- -D warnings

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: npm ci
      - name: Typecheck
        shell: bash
        run: scripts/ci-annotate.sh npm run typecheck
      - run: TZ=America/Los_Angeles npm test
      - run: TZ=Pacific/Auckland npm test
      - run: npm run build

  app:
    name: Desktop app (${{ matrix.os }})
    needs: [core, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Cache llama-server build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .llama-build
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ env.LLAMA_CPP_REF }}-${{ hashFiles('scripts/build-llama-server.sh') }}
      - name: Build bundled model runtime (llama-server)
        shell: bash
        run: |
          # Older runs built this inside target/; drop it from the restored Rust cache.
          rm -rf target/llama.cpp
          scripts/build-llama-server.sh
      - run: npm ci
      - run: npm run build
      - name: Clippy
        shell: bash
        run: scripts/ci-annotate.sh cargo clippy --locked -p pluck --all-targets --message-format=short -- -D warnings
      - name: Unit tests (app crate)
        shell: bash
        run: scripts/ci-annotate.sh cargo test --locked -p pluck --lib
      - name: Build unsigned debug bundle
        shell: bash
        # Updater archives need the release signing key, which CI doesn't have.
        run: scripts/ci-annotate.sh npm run tauri build -- --debug --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Check the runtime is inside the bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(ls -d target/debug/bundle/macos/*.app)
          ls -l "$app/Contents/MacOS"
          test -x "$app/Contents/MacOS/llama-server"
          "$app/Contents/MacOS/llama-server" --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pluck-${{ matrix.os }}
          path: |
            target/debug/bundle/dmg/*.dmg
            target/debug/bundle/msi/*.msi
            target/debug/bundle/nsis/*.exe
          if-no-files-found: warn

  model-catalog:
    name: Model catalog links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check every catalog file exists on Hugging Face
        shell: bash
        run: |
          set -euo pipefail
          # repo/file pairs are read straight from the catalog source.
          grep -E '^\s+(repo|file): "' crates/pluck-core/src/models.rs | sed -E 's/.*"(.*)".*/\1/' | paste - - |
          while read -r repo file; do
            url="https://huggingface.co/$repo/resolve/main/$file"
            code=$(curl -s -o /dev/null -w '%{http_code}' -I -L "$url")
            echo "$code $url"
            if [ "$code" != "200" ]; then echo "::error::Model file not found: $url"; exit 1; fi
            meta=$(curl -sf "https://huggingface.co/api/models/$repo/tree/main")
            echo "$meta" | python3 -c "import json,sys; f=[e for e in json.load(sys.stdin) if e['path']=='$file'][0]; print('  size', f.get('lfs',{}).get('size', f.get('size')), 'sha256', f.get('lfs',{}).get('oid'))"
          done
