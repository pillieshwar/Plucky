[package]
name = "pluck"
description = "Select text anywhere, get a private, dated task. Runs a small model locally."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "pluck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pluck-core = { path = "../crates/pluck-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
arboard = "3"
enigo = "0.2"
env_logger = "0.11"
iana-time-zone = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }

[target.'cfg(windows)'.dependencies]
uiautomation = "0.16"
windows-sys = { version = "0.59", features = ["Win32_System_DataExchange"] }
