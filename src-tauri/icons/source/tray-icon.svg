  </defs>
  <rect x="14" y="4" width="72" height="92" rx="14" fill="url(#g)"/>
  <path d="M33 52 L50 70 L67 32" fill="none" stroke="#ffd27a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
  <g fill="#ffd27a">
    <rect x="24" y="43" width="18" height="18" rx="4"/>
    <rect x="41" y="61" width="18" height="18" rx="4"/>
    <rect x="58" y="23" width="18" height="18" rx="4"/>
