      <rect width="100" height="100" fill="#fff"/>
      <path d="M31 56 L45 69 L69 39" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="44" y="82" width="12" height="14" rx="2" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#cut)" fill="#000">
    <rect x="32" y="6" width="36" height="22" rx="5"/>
    <rect x="16" y="22" width="68" height="72" rx="9"/>
  </g>
</svg>
