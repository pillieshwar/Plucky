<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Todo City app icon: a building at night whose lit windows trace a check —
       every finished task is a light on. macOS grid: 824 px tile centred on a 1024 canvas. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2770"/>
      <stop offset="0.65" stop-color="#14143a"/>
      <stop offset="1" stop-color="#0b0b1e"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d58"/>
      <stop offset="1" stop-color="#1a1c3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(100 100) scale(8.24)">
    <rect width="100" height="100" rx="22.5" fill="url(#sky)"/>
    <circle cx="78" cy="20" r="6.5" fill="#eef0ff" opacity="0.92"/>
    <g fill="#ffffff" opacity="0.55"><circle cx="16" cy="18" r="0.8"/><circle cx="28" cy="11" r="0.6"/><circle cx="60" cy="12" r="0.7"/><circle cx="88" cy="38" r="0.6"/><circle cx="12" cy="40" r="0.6"/></g>
    <!-- Neighbours, dimmer. -->
    <rect x="9" y="60" width="13" height="32" rx="2" fill="#1d1f40"/>
    <rect x="80" y="54" width="12" height="38" rx="2" fill="#1d1f40"/>
    <!-- The building. -->
    <rect x="23" y="24" width="54" height="68" rx="5" fill="url(#wall)" stroke="#3d4178" stroke-width="1.2"/>
    <rect x="44" y="18" width="12" height="6" rx="1.5" fill="#2a2d58"/>
    <g fill="#33376a">
      <rect x="30" y="32" width="10" height="10" rx="2"/><rect x="45" y="32" width="10" height="10" rx="2"/>
      <rect x="45" y="47" width="10" height="10" rx="2"/><rect x="60" y="47" width="10" height="10" rx="2"/>
      <rect x="30" y="62" width="10" height="10" rx="2"/><rect x="60" y="62" width="10" height="10" rx="2"/>
      <rect x="30" y="77" width="10" height="10" rx="2"/><rect x="45" y="77" width="10" height="10" rx="2"/><rect x="60" y="77" width="10" height="10" rx="2"/>
    </g>
    <!-- Lit windows: a check. -->
    <circle cx="50" cy="60" r="26" fill="url(#glow)"/>
    <path d="M35 52 L50 67 L65 37" fill="none" stroke="#ffd27a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <g fill="#ffd27a">
      <rect x="30" y="47" width="10" height="10" rx="2"/>
      <rect x="45" y="62" width="10" height="10" rx="2"/>
      <rect x="60" y="32" width="10" height="10" rx="2"/>
    </g>
  </g>
</svg>
