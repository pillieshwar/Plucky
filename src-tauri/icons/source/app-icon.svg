<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- TodoCity app icon: one building, centred, whose three lit windows trace a tick —
       every finished task is a light on. macOS grid: 824 px tile centred on a 1024 canvas. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34307f"/><stop offset="1" stop-color="#121232"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e3166"/><stop offset="1" stop-color="#20234a"/></linearGradient>
  </defs>
  <g transform="translate(100 100) scale(8.24)">
    <rect width="100" height="100" rx="22.5" fill="url(#sky)"/>
    <rect x="22" y="15" width="56" height="70" rx="7" fill="url(#wall)"/>
    <g fill="#3a3e78">
      <rect x="30" y="28.5" width="11" height="11" rx="2.5"/><rect x="44.5" y="28.5" width="11" height="11" rx="2.5"/>
      <rect x="44.5" y="44.5" width="11" height="11" rx="2.5"/><rect x="59" y="44.5" width="11" height="11" rx="2.5"/>
      <rect x="30" y="60.5" width="11" height="11" rx="2.5"/><rect x="59" y="60.5" width="11" height="11" rx="2.5"/>
    </g>
    <path d="M35.5 50 L50 66 L64.5 34" fill="none" stroke="#ffd27a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <g fill="#ffd27a">
      <rect x="30" y="44.5" width="11" height="11" rx="2.5"/>
      <rect x="44.5" y="60.5" width="11" height="11" rx="2.5"/>
      <rect x="59" y="28.5" width="11" height="11" rx="2.5"/>
    </g>
  </g>
</svg>
